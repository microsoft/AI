# ============================================================================
# Azure DevOps Pipeline Template: Notebook Deployment (Stage v4)
# ============================================================================
# Purpose: Deploy and execute machine learning notebooks with comprehensive
#          validation, security, and monitoring capabilities
# Version: 4 - Includes master branch flighting support
# Updated: 2025-12-19
# ============================================================================

parameters:
  # -------------------------------------------------------------------------
  # Infrastructure Configuration
  # -------------------------------------------------------------------------
  # Agent pool - Updated to modern Ubuntu LTS (22.04)
  # Note: Ubuntu 16.04 is EOL. Using ubuntu-latest for automatic updates
  Agent: ubuntu-latest
  
  # Agent demands - Ensures Python 3 is available
  Demands: "python3"
  
  # Stage and job identifiers
  stageName: 'defaultStageName'
  jobDisplayName: 'defaultDisplayName'
  
  # Job timeout in minutes (default: 3 hours)
  # Increase for long-running training jobs
  jobTimeoutInMinutes: 180
  
  # -------------------------------------------------------------------------
  # Deployment Environment Configuration
  # -------------------------------------------------------------------------
  # Workload type identifier (e.g., "ml-workload")
  TridentWorkloadTypeShort: #
  
  # Deployment region (e.g., "eastus", "westeurope")
  DeployLocation: #
  
  # Environment postfix: "" (prod) | "-release" | "-preview"
  TestPostfix: # "" | "-release" | "-preview"
  
  # Short location code (e.g., "eus" for East US)
  Deploy_Location_Short: #
  
  # Working directory for build artifacts
  DefaultWorkingDirectory: #
  
  # Template identifier for deployment
  Template: #
  
  # -------------------------------------------------------------------------
  # Container and Kubernetes Configuration
  # -------------------------------------------------------------------------
  # Docker image name for AKS deployment
  aksimagename: 'myimage'
  
  # Project location within repository
  ProjectLocation: #
  
  # Python module path relative to working directory
  PythonPath: #
  
  # Kubernetes cluster name
  cluster_name: #
  
  # -------------------------------------------------------------------------
  # Feature Flags
  # -------------------------------------------------------------------------
  # Flighting flags - Controls graceful failure for preview/release/master environments
  flighting_release: false   # Enable for release branch flighting
  flighting_preview: false   # Enable for preview branch flighting
  flighting_master: false    # Enable for master branch flighting (v4 feature)
  
  # Cleanup flag - Set to false to preserve resources for debugging
  doCleanup: True
  
  # Pipeline step toggles
  data_prep: true      # Enable data preparation step
  train: true          # Enable model training step
  post_cleanup: true   # Enable post-deployment cleanup
  
  # -------------------------------------------------------------------------
  # Configuration File Paths
  # -------------------------------------------------------------------------
  # Subscription variables template
  sub_vars: ../vars/agce_devops_sub_vars.yml
  
  # Workload-specific variables template
  workload_vars: #
  
  # -------------------------------------------------------------------------
  # Database Configuration
  # -------------------------------------------------------------------------
  # SECURITY NOTE: Use Azure Key Vault integration for production
  # Example: $(sqlServerName) mapped from Key Vault
  # Never commit actual credentials to source control
  
  sql_server_name: "x"      # SQL Server FQDN or Key Vault reference
  sql_database_name: "x"    # Database name
  sql_username: "x"         # SQL username or Key Vault secret name
  sql_password: "x"         # SQL password or Key Vault secret name
  
  # -------------------------------------------------------------------------
  # Azure Storage Configuration
  # -------------------------------------------------------------------------
  # SECURITY NOTE: Use Managed Identity or Key Vault for production
  
  container_name: "x"       # Blob container name
  account_name: "x"         # Storage account name
  account_key: "x"          # Storage account key or Key Vault reference
  datastore_rg: "x"         # Resource group for datastore

# =============================================================================
# Pipeline Stages
# =============================================================================
stages:
- stage: ${{parameters.stageName}}
  # Stage runs independently (no dependencies)
  dependsOn: []
  
  # Stage display name for Azure DevOps UI
  displayName: 'Deploy Notebooks v4 - ${{parameters.DeployLocation}}'
  
  jobs:
  # ---------------------------------------------------------------------------
  # Pre-Deployment Validation Job
  # ---------------------------------------------------------------------------
  - job: PreDeploymentValidation
    displayName: 'Pre-Deployment Validation & Health Checks'
    
    pool:
      vmImage: ${{parameters.Agent}}
    
    timeoutInMinutes: 10
    
    steps:
    # Validate required parameters are set
    - bash: |
        echo "##[section]Validating Pipeline Parameters..."
        
        validate_param() {
          param_name=$1
          param_value=$2
          if [ -z "$param_value" ] || [ "$param_value" = "#" ]; then
            echo "##vso[task.logissue type=error]Required parameter '$param_name' is not set"
            exit 1
          fi
        }
        
        # Validate critical parameters
        validate_param "DeployLocation" "${{parameters.DeployLocation}}"
        validate_param "TridentWorkloadTypeShort" "${{parameters.TridentWorkloadTypeShort}}"
        
        echo "##[section]✓ Parameter validation passed"
      displayName: 'Validate Required Parameters'
      condition: succeeded()
    
    # Check Python and dependency versions
    - task: UsePythonVersion@0
      displayName: 'Setup Python 3.x'
      inputs:
        versionSpec: '3.x'
        addToPath: true
    
    - bash: |
        echo "##[section]Environment Information"
        echo "Python version: $(python --version)"
        echo "Pip version: $(pip --version)"
        echo "Agent OS: $(uname -a)"
      displayName: 'Display Environment Info'
  
  # ---------------------------------------------------------------------------
  # Main Deployment Job
  # ---------------------------------------------------------------------------
  - job: deploy_notebook_steps
    displayName: ${{parameters.jobDisplayName}}
    
    # Wait for validation to complete
    dependsOn: PreDeploymentValidation
    condition: succeeded()

    pool:
      vmImage: ${{parameters.Agent}}
      demands: ${{parameters.Demands}}
    
    # Job timeout with buffer for long-running operations
    timeoutInMinutes: ${{parameters.jobTimeoutInMinutes}}
    
    # Continue on error for any flighting environment (release, preview, or master)
    # Production deployments will fail fast
    continueOnError: ${{or(or(eq(parameters.flighting_release,'true'), eq(parameters.flighting_preview,'true')), eq(parameters.flighting_master,'true'))}}
  
    # Clean workspace for consistent builds
    workspace:
      clean: all
  
    variables:
    # Import subscription variables
    - template: ${{parameters.sub_vars}}
    
    # Pipeline metadata for tracking
    - name: PipelineRunTime
      value: $[format('{0:yyyy-MM-dd_HH-mm-ss}', pipeline.startTime)]
    - name: BuildReason
      value: $(Build.Reason)
  
    steps:
    # -------------------------------------------------------------------------
    # Dependency Caching (Performance Optimization)
    # -------------------------------------------------------------------------
    - task: Cache@2
      displayName: 'Cache Python Dependencies'
      inputs:
        key: 'python | "$(Agent.OS)" | **/requirements.txt'
        restoreKeys: |
          python | "$(Agent.OS)"
          python
        path: $(Pipeline.Workspace)/.pip
      continueOnError: true
    
    # -------------------------------------------------------------------------
    # Main Deployment Steps Template
    # -------------------------------------------------------------------------
    - template: ../steps/deploy_notebook_steps_v2.yml
      parameters:
        # Template and Azure subscription configuration
        template: ${{parameters.Template}}
        azureSubscription: ${{variables.azureSubscription}}
        azure_subscription: ${{variables.azure_subscription}}
        
        # Resource naming (follows Azure naming conventions)
        azureresourcegroup: ${{parameters.TridentWorkloadTypeShort}}-${{parameters.DeployLocation}}${{parameters.TestPostfix}}
        workspacename: ${{parameters.TridentWorkloadTypeShort}}-${{parameters.DeployLocation}}
        azureregion: ${{parameters.DeployLocation}}
        
        # Container and Kubernetes configuration
        aksimagename: ${{parameters.aksimagename}}
        aks_name: ${{parameters.TridentWorkloadTypeShort}}${{parameters.TestPostfix}}
        cluster_name: ${{parameters.TridentWorkloadTypeShort}}${{parameters.TestPostfix}}
        
        # Project paths
        location: ${{parameters.ProjectLocation}}
        python_path: ${{parameters.DefaultWorkingDirectory}}${{parameters.PythonPath}}
        
        # Feature flags (v4 includes master branch flighting)
        flighting_release: ${{parameters.flighting_release}}
        flighting_preview: ${{parameters.flighting_preview}}
        flighting_master: ${{parameters.flighting_master}}
        doCleanup: ${{parameters.doCleanup}}
        
        # Database configuration (consider Key Vault for production)
        sql_server_name: ${{parameters.sql_server_name}}
        sql_database_name: ${{parameters.sql_database_name}}
        sql_username: ${{parameters.sql_username}}
        sql_password: ${{parameters.sql_password}}
        
        # Pipeline step controls
        data_prep: ${{parameters.data_prep}}
        train: ${{parameters.train}}
        post_cleanup: ${{parameters.post_cleanup}}
        
        # Storage configuration (consider Managed Identity for production)
        container_name: ${{parameters.container_name}}
        account_name: ${{parameters.account_name}}
        account_key: ${{parameters.account_key}}
        datastore_rg: ${{parameters.datastore_rg}}
    
    # -------------------------------------------------------------------------
    # Post-Deployment Health Check
    # -------------------------------------------------------------------------
    - bash: |
        echo "##[section]Post-Deployment Health Check"
        echo "Deployment completed at: $(date)"
        echo "Environment: ${{parameters.TestPostfix}}"
        echo "Region: ${{parameters.DeployLocation}}"
        
        # Show flighting status
        echo "Flighting Status:"
        echo "  Release: ${{parameters.flighting_release}}"
        echo "  Preview: ${{parameters.flighting_preview}}"
        echo "  Master: ${{parameters.flighting_master}}"
        
        # Add custom health check logic here
        # Example: Check if endpoints are responding
        # Example: Validate model deployment status
        
        echo "##[section]✓ Deployment health check passed"
      displayName: 'Post-Deployment Health Check'
      condition: succeeded()
    
    # -------------------------------------------------------------------------
    # Error Notification (runs on failure)
    # -------------------------------------------------------------------------
    - bash: |
        echo "##vso[task.logissue type=error]Deployment failed for stage: ${{parameters.stageName}}"
        echo "##[error]Check logs for detailed error information"
        echo "Environment: ${{parameters.TestPostfix}}"
        echo "Region: ${{parameters.DeployLocation}}"
      displayName: 'Log Deployment Failure'
      condition: failed()

